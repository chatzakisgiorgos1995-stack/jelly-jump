<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#7357ce"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Jelly Jump</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif;background:#9bdcf4}canvas{display:block;width:100%;height:100%}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#27185a55;color:white;text-align:center}#panel{background:#50399cd9;border:2px solid #ffffff66;border-radius:28px;padding:26px;max-width:310px;box-shadow:0 12px 50px #1e165c55}h1{font-size:38px;margin:0 0 10px}p{line-height:1.5}button{background:#ffda61;border:0;border-radius:16px;padding:14px 30px;font-weight:900;font-size:20px;color:#533574;cursor:pointer}#hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;text-align:center;color:white;font-size:42px;font-weight:900;text-shadow:0 3px 6px #4d3a86;pointer-events:none;padding-top:12px}#sound{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 15px);font-size:24px;background:#ffffffaa;padding:8px;border-radius:50%}</style></head><body><canvas id="game"></canvas><div id="hud">0</div><button id="sound" aria-label="Ήχος">🔊</button><div id="overlay"><div id="panel"><h1>🍮 JELLY JUMP</h1><p id="message">Πέρνα ανάμεσα από τους σωλήνες!<br>Άγγιξε την οθόνη για να αναπηδήσεις.</p><button id="start">ΠΑΙΞΕ!</button><p id="best"></p></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),hud=document.getElementById('hud'),message=document.getElementById('message'),bestText=document.getElementById('best'),start=document.getElementById('start'),soundBtn=document.getElementById('sound');let W,H,dpr,ground,playing=false,dead=false,score=0,best=Number(localStorage.getItem('jelly-best')||0),pipes=[],time=0,last=0,spawn=0,muted=false;const jelly={x:0,y:0,vy:0,r:23};function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ground=H-70;jelly.x=Math.min(W*.27,140);if(!playing)jelly.y=H*.43}addEventListener('resize',resize);resize();function reset(){pipes=[];score=0;spawn=0;time=0;dead=false;playing=true;jelly.y=H*.42;jelly.vy=-4;hud.textContent='0';overlay.style.display='none'}function jump(){if(!playing)return;jelly.vy=-5.9;beep(520,.045)}function beep(freq,dur){if(muted)return;try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.type='sine';g.gain.value=.035;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);o.onended=()=>a.close()}catch(e){}}function end(){if(dead)return;dead=true;playing=false;beep(170,.17);best=Math.max(best,score);localStorage.setItem('jelly-best',best);message.innerHTML=`Σκορ: <b>${score}</b><br>Προσπάθησε ξανά!`;bestText.textContent='🏆 Ρεκόρ: '+best;start.textContent='ΞΑΝΑΠΑΙΞΕ';overlay.style.display='flex'}function pipe(x,top,gap){const pw=68;ctx.fillStyle='#35b979';ctx.strokeStyle='#208e64';ctx.lineWidth=3;ctx.fillRect(x,0,pw,top);ctx.strokeRect(x,-4,pw,top+4);ctx.fillRect(x,top+gap,pw,ground-(top+gap));ctx.strokeRect(x,top+gap,pw,ground-(top+gap));ctx.fillStyle='#54d999';ctx.fillRect(x+8,0,10,top);ctx.fillRect(x+8,top+gap,10,ground-top-gap);for(const yy of [top-20,top+gap]){ctx.fillStyle='#27ad6e';ctx.fillRect(x-6,yy,pw+12,20);ctx.strokeRect(x-6,yy,pw+12,20)}}function drawJelly(){ctx.save();ctx.translate(jelly.x,jelly.y);const stretch=playing?Math.min(.15,Math.abs(jelly.vy)*.018):Math.sin(time*.06)*.04;ctx.scale(1-stretch,1+stretch);ctx.shadowColor='#a846da88';ctx.shadowBlur=18;const gr=ctx.createLinearGradient(-25,-25,25,30);gr.addColorStop(0,'#ffc4f3');gr.addColorStop(.5,'#e47bdb');gr.addColorStop(1,'#9b4ec6');ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(-23,8);ctx.bezierCurveTo(-29,-15,-15,-27,0,-27);ctx.bezierCurveTo(22,-28,30,-9,24,13);ctx.quadraticCurveTo(17,28,0,25);ctx.quadraticCurveTo(-21,29,-23,8);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-9,-7,6,8,0,0,7);ctx.ellipse(10,-7,6,8,0,0,7);ctx.fill();ctx.fillStyle='#34245c';ctx.beginPath();ctx.arc(-8,-5,3.3,0,7);ctx.arc(11,-5,3.3,0,7);ctx.fill();ctx.strokeStyle='#7b338f';ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(1,4,6,.1,Math.PI-.1);ctx.stroke();ctx.fillStyle='#ffffff88';ctx.beginPath();ctx.ellipse(-12,-16,7,3,-.5,0,7);ctx.fill();ctx.restore()}function background(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#80c5f4');sky.addColorStop(.7,'#b7e5f4');sky.addColorStop(1,'#e5e6b4');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);for(let i=0;i<8;i++){const x=((i*170-time*.23)%(W+220)+W+220)%(W+220)-60,y=80+(i*91)%(Math.max(120,ground-170));ctx.fillStyle='#ffffffa8';ctx.beginPath();ctx.ellipse(x,y,37,13,0,0,7);ctx.ellipse(x+22,y-7,27,17,0,0,7);ctx.fill()}ctx.fillStyle='#79c891';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#5baf7a';ctx.fillRect(0,ground,W,9);for(let i=0;i<W/35+2;i++){let x=i*35-(time*.9%35);ctx.fillStyle='#9cdd99';ctx.fillRect(x,ground+24,17,5)}}function frame(t){const dt=Math.min((t-last)/16.667||1,2);last=t;time+=dt;background();if(playing){jelly.vy+=.31*dt;jelly.y+=jelly.vy*dt;spawn+=dt;if(spawn>95){spawn=0;const gap=Math.max(145,Math.min(200,H*.25));const top=80+Math.random()*Math.max(30,ground-gap-170);pipes.push({x:W+20,top,gap,passed:false})}}for(const p of pipes){if(playing)p.x-=2.65*dt;pipe(p.x,p.top,p.gap);if(playing){if(!p.passed&&p.x+68<jelly.x){p.passed=true;score++;hud.textContent=score;beep(760,.06)}if(jelly.x+jelly.r-7>p.x&&jelly.x-jelly.r+7<p.x+68&&(jelly.y-jelly.r+6<p.top||jelly.y+jelly.r-6>p.top+p.gap))end()}}pipes=pipes.filter(p=>p.x>-90);if(playing&&(jelly.y+jelly.r>ground||jelly.y-jelly.r<0))end();drawJelly();requestAnimationFrame(frame)}requestAnimationFrame(frame);start.onclick=e=>{e.stopPropagation();reset()};canvas.addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(playing)jump();else reset()}});soundBtn.onclick=()=>{muted=!muted;soundBtn.textContent=muted?'🔇':'🔊'};bestText.textContent='🏆 Ρεκόρ: '+best;if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
